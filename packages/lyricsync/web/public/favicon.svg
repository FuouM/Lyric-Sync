<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Five-pointed star -->
    <polygon id="fav-star" points="0,-7 1.8,-2.2 7,-2.1 2.8,0.9 4.3,6 0,2.8 -4.3,6 -2.8,0.9 -7,-2.1 -1.8,-2.2" />
    <!-- Sparkle -->
    <polygon id="fav-sparkle" points="0,-3 0.8,-0.8 3,0 0.8,0.8 0,3 -0.8,0.8 -3,0 -0.8,-0.8" />
  </defs>
  
  <!-- High-contrast badge disc -->
  <circle cx="16" cy="16" r="14.5" fill="#152238" stroke="#ffffff" stroke-width="1.8" />
  
  <!-- Diagonal axis connecting stars -->
  <line x1="9" y1="22" x2="20" y2="10" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- Hero Star crossing the bottom rim -->
  <use href="#fav-star" transform="translate(9, 22) scale(1.05)" fill="#ffffff" />
  
  <!-- Companion Upper Star -->
  <use href="#fav-star" transform="translate(20, 10) scale(0.72)" fill="#ffffff" />
  
  <!-- Cyan/blue accents for tab pop -->
  <circle cx="10" cy="11" r="1.6" fill="#93c5fd" />
  <use href="#fav-sparkle" transform="translate(22, 20) scale(0.9)" fill="#93c5fd" />
  <circle cx="21" cy="15" r="1.2" fill="#ffffff" />
</svg>
